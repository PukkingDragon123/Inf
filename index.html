<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Infinite Choco — Street Hustle</title>
<meta name="description" content="Chocolate is illegal. Run a back-alley lab: cut the impossible bar, cook it down, take drops on your burner, and dodge the cops as your heat rises.">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23120d16'/><rect x='5' y='7' width='22' height='18' fill='%233a2415'/><rect x='8' y='10' width='6' height='5' fill='%236a4222'/><rect x='18' y='10' width='6' height='5' fill='%236a4222'/><rect x='8' y='17' width='6' height='5' fill='%236a4222'/><rect x='18' y='17' width='6' height='5' fill='%236a4222'/></svg>">
</head>
<body>
<div id="game">

  <div id="world-wrap">
    <canvas id="world" width="640" height="360"></canvas>
    <div id="scanlines"></div>
    <div id="cash-chip"><span class="c">§</span><span id="cash">0</span></div>
    <div id="scene-label"><span id="scene-name"></span></div>
    <div id="w-toasts"></div>
    <button id="phone-btn" title="Phone"><span></span></button>
  </div>

  <!-- diegetic phone -->
  <div id="phone" class="closed">
    <div id="phone-frame">
      <div id="phone-cam"></div>
      <div id="phone-status">
        <span id="ph-time">9:41</span>
        <span id="ph-right"><span id="ph-net">BURNER</span> <span id="ph-cash">§0</span> <span id="ph-batt">42</span></span>
      </div>
      <div id="phone-screen"></div>
      <div id="phone-nav">
        <button id="ph-back" title="Back">‹</button>
        <button id="ph-home" title="Home"></button>
        <button id="ph-close" title="Pocket phone">×</button>
      </div>
    </div>
  </div>

  <div id="overlay" class="show">
    <div id="overlay-card">
      <div id="overlay-title"></div>
      <div id="overlay-text"></div>
      <button class="pbtn big" id="overlay-btn">ENTER</button>
    </div>
  </div>

</div>
<script src="game.js"></script>
</body>
</html>
